  <title>Instalar BBVA</title>
  <style>
    :root{--fondo:#030594;--fondo2:#030594;--profundo:#030594;--aqua:#4fd6d7;--blanco:#fff;--papel:#f4f7fa;--tinta:#182b3d;--gris:#607487;--rojo:#ff3b30}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:var(--fondo);font-family:Arial,Helvetica,sans-serif}button,a{font:inherit}
    body{color:#fff}.pagina{position:relative;width:100%;min-height:100vh;min-height:100dvh;overflow:hidden;background:var(--fondo)}
    .cuerpo{width:min(100%,430px);min-height:100vh;min-height:100dvh;margin:auto;padding:max(10px,env(safe-area-inset-top)) 18px max(12px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;text-align:center}
    .cambiar{align-self:flex-end;min-height:31px;padding:0 12px;border:1px solid #ffffff5c;border-radius:999px;color:#fff;background:#ffffff12;font-size:9px;font-weight:800;cursor:pointer;backdrop-filter:blur(10px)}
    h1{margin:14px 0 0;font-size:clamp(19px,5.2vw,25px);font-weight:900;line-height:1.08;text-transform:uppercase}.sub{margin:10px 0 0;color:#ffffffdb;font-size:clamp(11px,3vw,14px);line-height:1.4}
    .copiar{min-height:40px;margin-top:12px;padding:0 15px;border:0;border-radius:9px;color:#465765;background:#f5f7f9;box-shadow:0 6px 16px #00105c66;font-size:12px;font-weight:800;cursor:pointer}.copiar svg{width:16px;margin-right:6px;vertical-align:-4px}
    .progreso{width:100%;margin-top:20px;display:grid;grid-template-columns:42px 1fr 42px 1fr 42px;align-items:center;gap:9px}.punto{width:42px;height:42px;border:0;border-radius:50%;color:#65717d;background:#fff;box-shadow:inset 0 0 0 2px #e9edf0;font-size:16px;cursor:pointer}.punto.activo{color:var(--profundo);background:var(--aqua);box-shadow:0 6px 18px #4fd6d754}.linea{height:2px;background:#ffffffb8;border-radius:8px}.linea.lista{background:var(--aqua)}
    .texto{margin:20px 0 0;font-size:clamp(11px,3vw,14px);line-height:1.35}.texto strong{font-weight:900}
    .visual{width:100%;min-height:185px;margin-top:10px;display:flex;align-items:flex-start;justify-content:center;color:var(--tinta)}
    .chrome{position:relative;width:100%;padding:10px 9px;border-radius:18px;background:#111319;box-shadow:0 14px 32px #00105c73}.chrome-top{height:45px;display:grid;grid-template-columns:28px 1fr 30px 30px 22px;align-items:center;gap:7px;color:#fff}.direccion{height:34px;padding:0 11px;display:flex;align-items:center;gap:7px;min-width:0;border-radius:18px;color:#eef5f8;background:#303239;font-size:10px;font-weight:700;white-space:nowrap}.direccion span{overflow:hidden;text-overflow:ellipsis}.direccion svg,.safari-address svg{width:16px;height:16px;flex:0 0 16px;fill:none;stroke:currentColor;stroke-width:2}.chrome-icon{width:21px;height:21px;display:grid;place-items:center;color:#fff}.chrome-icon svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2}.tab{width:22px;height:22px;display:grid;place-items:center;border:2px solid #fff;border-radius:6px;font-size:9px;font-weight:900}.dots{font-size:24px;line-height:1}.arrow{position:absolute;right:-1px;top:-35px;width:34px;height:44px;color:var(--rojo);animation:flecha 1.2s infinite}.arrow path{fill:none;stroke:currentColor;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
    .safari{width:100%;padding:12px;border:1px solid #ffffff35;border-radius:31px;color:#fff;background:#ffffff18;box-shadow:0 17px 38px #00105c66;backdrop-filter:blur(12px)}.safari-address{height:48px;padding:0 15px;display:grid;grid-template-columns:28px 1fr 28px;align-items:center;border-radius:24px;background:#062046d9}.safari-domain{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;font-weight:800}.safari-tools{padding:12px 7px 1px;display:flex;align-items:center;justify-content:space-between}.safari-tools svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:2}.disabled{opacity:.3}
    .menu-sheet{width:min(100%,355px);padding:8px;border-radius:14px;color:#2d3339;background:#f7f7f8;box-shadow:0 16px 38px #00105c73;text-align:left}.menu-row{min-height:48px;padding:0 12px;display:flex;align-items:center;gap:13px;border-bottom:1px solid #dedfe1;font-size:14px}.menu-row:last-child{border:0}.menu-row svg{width:23px;height:23px;flex:0 0 23px;fill:none;stroke:#4b5259;stroke-width:2}.menu-row.selected{margin:3px 0;border:4px solid var(--rojo);border-radius:13px;background:#fff;font-weight:800}
    .share-sheet{width:min(100%,375px);padding:13px;border-radius:23px;color:#202327;background:#f0f1f4;box-shadow:0 16px 38px #00105c70;text-align:left}.share-actions{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:11px}.share-action{text-align:center;font-size:8px;line-height:1.25}.share-circle{width:46px;height:46px;margin:0 auto 5px;display:grid;place-items:center;border-radius:50%;background:#fff}.share-circle svg{width:23px;height:23px;fill:none;stroke:#31363b;stroke-width:2}.share-list{padding:4px 9px;border-radius:14px;background:#fff}.share-row{min-height:41px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #ddd;font-size:12px}.share-row:last-child{border:0}.share-row svg{width:19px;height:19px;fill:none;stroke:#353a40;stroke-width:2}.share-row.selected{margin:2px -4px;padding:0 4px;border:4px solid var(--rojo);border-radius:11px;font-weight:800}
    .dialog{width:min(100%,370px);overflow:hidden;border-radius:17px;color:#1c2731;background:#fff;box-shadow:0 18px 42px #00105c78;text-align:left}.dialog-head{min-height:52px;padding:0 13px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #e2e7eb;font-size:13px;font-weight:800}.close{width:28px;height:28px;display:grid;place-items:center;border-radius:50%;background:#eef1f3;font-size:18px}.confirm{padding:6px 10px;border:3px solid var(--rojo);border-radius:9px;color:#0784ff;font-weight:850}.app-row{padding:12px 13px;display:grid;grid-template-columns:48px 1fr auto;align-items:center;gap:11px;background:#f5f7f9}.app-icon{width:48px;height:48px;border-radius:12px;object-fit:cover;box-shadow:0 4px 11px #06204642}.app-name{font-size:13px;font-weight:850}.app-url{max-width:190px;margin-top:4px;overflow:hidden;color:#8995a0;font-size:9px;text-overflow:ellipsis;white-space:nowrap}.android-confirm{color:#263643;background:#e7edf1}.android-confirm .confirm{color:#263643;font-size:11px}
    .acciones{margin-top:auto;padding-top:8px}.ayuda{width:auto;min-height:36px;padding:0 14px;border:1px solid #ffffff38;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;gap:6px;color:#fff;background:#ffffff12;text-decoration:none;font-size:10px;font-weight:800}.ayuda svg{width:15px}.pie{margin:7px 0 0;color:#ffffff9a;font-size:8px}.toast{position:fixed;z-index:5;left:50%;bottom:max(18px,env(safe-area-inset-bottom));padding:10px 14px;border-radius:11px;color:var(--profundo);background:#fff;box-shadow:0 10px 25px #00105c77;font-size:11px;font-weight:800;transform:translate(-50%,15px);opacity:0;pointer-events:none;transition:.2s}.toast.ver{transform:translate(-50%,0);opacity:1}
    @keyframes flecha{0%,100%{transform:translateY(0)}50%{transform:translateY(6px)}}
    @media(max-height:690px){h1{margin-top:8px;font-size:20px}.sub{margin-top:7px}.copiar{min-height:38px;margin-top:8px}.progreso{margin-top:14px;grid-template-columns:41px 1fr 41px 1fr 41px}.punto{width:41px;height:41px;font-size:16px}.texto{margin-top:13px}.visual{min-height:165px;margin-top:7px}.acciones{padding-top:4px}.ayuda{min-height:32px}.pie{display:none}}
  </style>

    function dialogo(ios){return '<div class="dialog '+(ios?'':'android-confirm')+'"><div class="dialog-head"><span class="close">×</span><span>'+(ios?'Agregar a inicio':'Instalar aplicación')+'</span><span class="confirm">'+(ios?'Agregar':'Instalar')+'</span></div><div class="app-row"><img class="app-icon" src="'+ICONO+'" alt=""><span><span class="app-name">'+NOMBRE+'</span><div class="app-url">https://'+dominio()+'/</div></span></div></div>'}
    function pintar(){var ios=vista==="ios",texto,html;if(paso===1){texto=ios?'En Safari toca el <strong>ícono compartir.</strong>':'En Chrome toca los <strong>tres puntos.</strong>';html=ios?safari():chrome()}else if(paso===2){texto=ios?'Selecciona <strong>“Agregar a inicio”.</strong>':'Selecciona <strong>“Instalar app”.</strong>';html=ios?iosMenu():androidMenu()}else{texto=ios?'Por último toca <strong>“Agregar”.</strong>':'Por último toca <strong>“Instalar”.</strong>';html=dialogo(ios)}$("titulo").textContent=ios?"Instalación para iPhone":"Instalación para Android";$("subtitulo").textContent=ios?"Copia el enlace y ábrelo en Safari.":"Copia el enlace y ábrelo en Chrome.";$("texto").innerHTML=texto;$("visual").innerHTML=html;document.querySelectorAll(".punto").forEach(function(p,i){p.classList.toggle("activo",i+1===paso)});document.querySelectorAll(".linea").forEach(function(l,i){l.classList.toggle("lista",paso>i+1)})}
    function aviso(t){var e=$("toast");e.textContent=t;e.classList.add("ver");clearTimeout(aviso.x);aviso.x=setTimeout(function(){e.classList.remove("ver")},1600)}
    function copiar(){var u=location.href;if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(u).then(function(){aviso("Enlace copiado")}).catch(alterna);else alterna()}
    function alterna(){var a=document.createElement("textarea");a.value=location.href;a.style.cssText="position:fixed;opacity:0";document.body.appendChild(a);a.select();try{document.execCommand("copy");aviso("Enlace copiado")}catch(e){aviso("Copia el enlace desde el navegador")}a.remove()}
    $("copiar").onclick=copiar;document.querySelectorAll("[data-paso]").forEach(function(b){b.onclick=function(){paso=Number(b.dataset.paso);pintar()}});if("serviceWorker" in navigator&&location.protocol!=="file:"){navigator.serviceWorker.register("./ngsw-worker.js").catch(function(){})}pintar();
  })();
